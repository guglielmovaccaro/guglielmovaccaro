<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<defs><clipPath id="bclip"><rect width="1200" height="400" rx="18"/></clipPath></defs>
<rect width="1200" height="400" rx="18" fill="#171614"/>
<rect x="1" y="1" width="1198" height="398" rx="17" fill="none" stroke="#E8622B" stroke-opacity="0.35" stroke-dasharray="6 6"/>

<g transform="translate(150,200) rotate(-18)">
  <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -6;0 0" dur="3s" repeatCount="indefinite"/>
  <rect x="-70" y="-38" width="140" height="76" rx="30" fill="#2E6B5E" opacity="0.85" stroke="#F5F5F3" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="68" y="-16" width="44" height="32" rx="6" fill="#2E6B5E" opacity="0.85" stroke="#F5F5F3" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="108" y="-12" width="18" height="24" rx="4" fill="#B07A4A"/>
