  <line x1="-36" y1="-6" x2="30" y2="-2" stroke="#B07A4A" stroke-width="2" transform="rotate(6)"/>
  <line x1="-36" y1="6" x2="20" y2="9" stroke="#B07A4A" stroke-width="2" transform="rotate(6)"/>
  <path d="M-56,-26 q20,-8 40,-4" stroke="#F5F5F3" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
</g>
<text x="330" y="92" font-size="24" font-weight="700" fill="#F5F5F3">Ahoy, you opened it.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.400;1" dur="0.75s" fill="freeze"/></text><text x="330" y="158" font-size="17" font-weight="400" fill="#E9D9C8">I'm Guglielmo. Italian, physics background, startupper for 5+ years.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.690;1" dur="1.45s" fill="freeze"/></text><text x="330" y="191" font-size="17" font-weight="400" fill="#E9D9C8">Not a dev, not a marketer: I do whatever it takes to ship things that matter.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.750;1" dur="1.80s" fill="freeze"/></text><text x="330" y="224" font-size="17" font-weight="400" fill="#E9D9C8">I build from the Ligurian coast, between a surf session and a BJJ class.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.791;1" dur="2.15s" fill="freeze"/></text><text x="330" y="283" font-size="17" font-weight="700" fill="#E8622B">Building something? Write me: hello@guglielmovaccaro.com<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.842;1" dur="2.85s" fill="freeze"/></text><text x="330" y="316" font-size="15" font-weight="400" fill="#9A958E">P.S. I hate calls. Messages travel better.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.859;1" dur="3.20s" fill="freeze"/></text>
