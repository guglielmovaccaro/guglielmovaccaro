<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'Plus Jakarta Sans', Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Boss fight: the Kraken of Series A, defeated by revenue from day one, a tiny burn rate and shipping every week</title><rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="20" fill="#EDE9DE" stroke="#D6D0C2" stroke-width="1.5"/><text x="40" y="52" text-anchor="start" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5" fill="#FF6600">BOSS FIGHT</text><rect x="1048" y="30" width="112" height="30" rx="8" fill="#1C1B18"/><text x="1104" y="50" text-anchor="middle" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#EDE9DE">TERM SHEET</text><text x="40" y="112" font-size="44" font-weight="800" letter-spacing="-1.2" fill="#1C1B18">The Kraken of <tspan fill="#FF6600">Series A</tspan></text><text x="40" y="150" font-size="18" fill="#6E6A60">Drags founders down with board seats, 2x liquidation prefs and "growth at all costs".</text><text x="40" y="200" text-anchor="start" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#1C1B18">HP</text><rect x="80" y="186" width="820" height="18" rx="4" fill="#E2DDD0"/><rect x="80" y="186" width="0" height="18" rx="4" fill="#FF6600"><animate attributeName="width" values="820;820;0;0" keyTimes="0;.15;.6;1" dur="6s" repeatCount="indefinite"/></rect><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.6;.62;1" dur="6s" repeatCount="indefinite"/><rect x="928" y="176" width="232" height="38" rx="8" fill="none" stroke="#FF6600" stroke-width="2.5" transform="rotate(-3 1044 195)"/><text x="1044" y="202" text-anchor="middle" font-family="'JetBrains Mono', 