<text x="32" y="84" font-size="32" font-weight="800" fill="#F5F5F3">CiaoBuilders</text>
<text x="568" y="44" text-anchor="end" font-size="13" fill="#9A958E">ciaobuilders.com</text>
<text x="32" y="124" font-size="15" fill="#D9D3CB">The Italian crew of founders, builders,</text><text x="32" y="146" font-size="15" fill="#D9D3CB">designers and marketers. Free to join, no</text><text x="32" y="168" font-size="15" fill="#D9D3CB">gurus, just people shipping.</text>
