<text x="568" y="44" text-anchor="end" font-size="13" fill="#9A958E">guglielmovaccaro.com</text>
<text x="32" y="124" font-size="15" fill="#D9D3CB">Newsletter and notes from the deck: what</text><text x="32" y="146" font-size="15" fill="#D9D3CB">worked, what sank, and daily reels at</text><text x="32" y="168" font-size="15" fill="#D9D3CB">@guglielmo.builds.</text>
